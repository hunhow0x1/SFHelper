<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SFHelper</title>
    <style>
      :root {
        --bg: #14110f;
        --panel: #1e1a16;
        --panel-2: #262019;
        --line: #3a3128;
        --text: #efe7db;
        --muted: #a8987f;
        --accent: #c9a55c;
        --accent-2: #6fae8f;
        --bar-bg: #2c251d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 16px 28px;
        align-items: baseline;
        background: linear-gradient(180deg, #1b1712, var(--bg));
      }
      h1 { font-size: 20px; margin: 0; letter-spacing: 0.5px; color: var(--accent); }
      .name { font-size: 18px; font-weight: 600; }
      .kpi { color: var(--muted); font-size: 13px; }
      .kpi b { color: var(--text); font-weight: 600; }
      main { max-width: 1100px; margin: 0 auto; padding: 0 24px 24px; }

      /* Tabs */
      .tabs {
        display: flex; gap: 2px; flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        position: sticky; top: 0; z-index: 5;
        background: var(--bg);
        margin: 0 -24px 22px; padding: 8px 24px 0;
      }
      .tab {
        padding: 10px 18px; cursor: pointer; color: var(--muted);
        border: 0; background: none; font: inherit; font-weight: 600;
        border-bottom: 2px solid transparent; border-radius: 0;
      }
      .tab:hover { color: var(--text); }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
      .panel { display: none; }
      .panel.active { display: grid; gap: 22px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
      @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } }

      section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 0 0 14px; }
      .setup { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      input {
        background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
        padding: 8px 12px; border-radius: 6px; font: inherit; min-width: 320px;
      }
      button {
        background: var(--accent); color: #201a10; border: 0; padding: 8px 16px;
        border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer;
      }
      .status { color: var(--muted); font-size: 13px; }
      .status.err { color: #d98a6a; }
      .rows { display: grid; gap: 10px; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
      .row .label { font-weight: 500; }
      .row .val { color: var(--muted); font-variant-numeric: tabular-nums; }
      .bar { grid-column: 1 / -1; height: 7px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
      .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .stat { background: var(--panel-2); border-radius: 8px; padding: 12px 14px; }
      .stat .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      .xpgroup { margin-bottom: 16px; }
      .xpgroup h3 { font-size: 13px; color: var(--accent-2); margin: 0 0 8px; }
      .xpgroup h3 .count { color: var(--muted); font-weight: 400; }
      .row .label .sub {
        color: var(--muted); font-size: 12px; border: 1px solid var(--line);
        border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap;
      }
      .muted { color: var(--muted); }
      .daily { color: var(--muted); font-size: 13px; margin: -4px 0 14px; }
      .daily b { color: var(--text); font-variant-numeric: tabular-nums; }
      .invstatus {
        color: var(--muted); font-size: 12px;
        margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line);
      }
      .invstatus:empty { display: none; }
      .invstatus b { color: var(--text); font-variant-numeric: tabular-nums; }
      button.mini {
        background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
        padding: 1px 8px; font-size: 12px; font-weight: 500; border-radius: 4px;
      }
      button.mini:hover { color: var(--text); }
      table { width: 100%; border-collapse: collapse; }
      td, th { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
      th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; }
      td.num, th.num { text-align: right; }
      td.act, th.act { text-align: right; white-space: nowrap; }
      table.loadouts td .fav { color: var(--accent); }
      table.loadouts td .tag {
        color: var(--muted); font-size: 11px; border: 1px solid var(--line);
        border-radius: 4px; padding: 0 5px; margin-left: 6px;
      }
      table.loadouts td.name { cursor: pointer; }
      table.loadouts .chev {
        display: inline-block; color: var(--muted); font-size: 10px;
        width: 12px; transition: transform 0.12s; transform: rotate(0deg);
      }
      table.loadouts .name.open .chev { transform: rotate(90deg); }
      tr.detail { display: none; }
      tr.detail.open { display: table-row; }
      tr.detail > td { background: var(--bg); padding: 12px 8px 14px; }
      .slotgrp { margin-bottom: 10px; }
      .slotgrp:last-child { margin-bottom: 0; }
      .slotgrp .slothead { color: var(--text); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
      .slotgrp .slothead .kind { color: var(--muted); font-weight: 400; }
      .chipline { margin: 2px 0; }
      .chipline .h {
        color: var(--accent-2); font-size: 11px; text-transform: uppercase;
        letter-spacing: 0.6px; margin-right: 6px;
      }
      .chip {
        display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 8px; margin: 2px 5px 2px 0; font-size: 12px;
      }
      .totemlist { display: inline-block; vertical-align: top; max-width: 680px; }
      .totemrow { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
      .totemrow .tname {
        flex: 0 0 140px; font-size: 12px;
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 8px;
      }
      .totemrow .teff { color: var(--muted); font-size: 12px; min-width: 0; }
      .jmini { height: 18px; width: 18px; vertical-align: -4px; margin-left: 6px; opacity: 0.9; }
      .jtype { color: var(--muted); font-size: 12px; }
      .chipline .jicon { height: 26px; width: 26px; vertical-align: middle; margin-right: 8px; }
      .chipline .jname { font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1>SFHelper</h1>
      <span class="name" id="displayName">—</span>
      <span class="kpi">Level <b id="level">—</b></span>
      <span class="kpi">Played <b id="playtime">—</b></span>
      <span class="kpi">Daily reset <b id="dailyReset">—</b></span>
      <span class="kpi" id="updated"></span>
    </header>
    <main>
      <nav class="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="loadouts">Loadouts</button>
        <button class="tab" data-tab="stats">Stats</button>
      </nav>

      <!-- OVERVIEW -->
      <div class="panel active" id="panel-overview">
        <section>
          <h2>Account</h2>
          <div class="setup">
            <input id="accountId" placeholder="24-character account id" spellcheck="false" />
            <button id="save">Track</button>
            <span class="status" id="status">Enter your account id to begin.</span>
          </div>
        </section>

        <section>
          <h2>Faction Standing</h2>
          <div class="daily" id="dailyStanding"></div>
          <div class="rows" id="factions"><span class="muted">—</span></div>
        </section>

        <div class="cols">
          <section>
            <h2>Faction Tokens</h2>
            <div class="grid" id="factionTokens"></div>
          </section>

          <section>
            <h2>Currencies</h2>
            <div class="grid" id="currencies"></div>
            <div class="invstatus" id="invStatus"></div>
          </section>
        </div>

        <section>
          <h2>World Timers</h2>
          <div class="rows" id="worldTimers"><span class="muted">—</span></div>
        </section>
      </div>

      <!-- LOADOUTS -->
      <div class="panel" id="panel-loadouts">
        <section>
          <h2>Loadouts</h2>
          <div id="loadouts"><span class="muted">—</span></div>
          <div class="setup" style="margin-top: 16px">
            <input id="importBuild" placeholder="Paste a build JSON to import" spellcheck="false" />
            <button id="importBtn">Import</button>
            <span class="status" id="importStatus"></span>
          </div>
        </section>
      </div>

      <!-- STATS -->
      <div class="panel" id="panel-stats">
        <section>
          <h2>Weapon &amp; Pact XP</h2>
          <div id="xp"><span class="muted">—</span></div>
        </section>

        <section>
          <h2>Combat</h2>
          <div class="grid" id="scalars"></div>
          <div style="margin-top:18px" class="cols" id="tables"></div>
        </section>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => (typeof n === "number" ? n.toLocaleString() : "—");

      // Tabs
      document.querySelectorAll(".tab").forEach((t) => {
        t.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
          document.querySelectorAll(".panel").forEach((p) =>
            p.classList.toggle("active", p.id === "panel-" + t.dataset.tab),
          );
        });
      });

      // In-game display names, loaded from /names.json. Until an entry exists
      // for an item, we fall back to a cleaned-up path segment.
      let DICT = { items: {}, factions: {}, factionTokens: {}, currencies: {} };
      // Lowercased item-name index, so lookups survive the source dict's casing
      // inconsistencies (e.g. LongbladeProjectileRune vs LongBladeProjectileRune).
      let DICT_LC = {};
      // Per-faction, per-rank standing caps (from faction-ranks.json).
      let FACTION_RANKS = {};
      // Totem / rune display name -> effect text (from totems.json / runes.json).
      let TOTEMS = {};
      let RUNES = {};

      // Cumulative standing to REACH each rank (caps are per-rank earn amounts).
      function rankInfo(tag, standing, rank) {
        const caps = FACTION_RANKS[tag] || FACTION_RANKS.default || [];
        if (!caps.length) return null;
        const reach = [0];
        for (let i = 0; i < caps.length; i++) reach[i + 1] = reach[i] + caps[i];
        const r = Math.min(Math.max(rank ?? 0, 0), caps.length - 1);
        const base = reach[r];
        const cap = caps[r];
        const into = Math.max(0, (standing ?? 0) - base);
        return { cap, into, pct: cap ? Math.min(1, into / cap) : 0, atMax: r === caps.length - 1 };
      }

      // Daily standing resets at 00:00 UTC (DE's daily reset). Pure client clock.
      function msToDailyReset() {
        const now = new Date();
        return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1) - now.getTime();
      }
      function fmtDur(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        const p = (n) => String(n).padStart(2, "0");
        return `${p(Math.floor(s / 3600))}:${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}`;
      }

      // Loadouts / builds. Presets come from the inventory; imported builds are
      // kept in this browser so they survive refreshes. Columns, left to right:
      // Loadout (name) | Pact (soul/s) | Primary Weapon (m slot) | Sidearm (l slot).
      let LAST_BUILDS = [];
      let IMPORTED_BUILDS = [];
      try { IMPORTED_BUILDS = JSON.parse(localStorage.getItem("sfhelper.builds") || "[]"); } catch {}

      // A slot may arrive as an ItemType string (old exports/localStorage) or as
      // { type, runes, totems } (current). Normalize both to the object form.
      function normSlot(x) {
        if (x == null) return { type: null, runes: [], totems: [] };
        if (typeof x === "string") return { type: x, runes: [], totems: [] };
        return {
          type: x.type ?? null,
          runes: Array.isArray(x.runes) ? x.runes : [],
          totems: Array.isArray(x.totems) ? x.totems : [],
          joinery: x.joinery && typeof x.joinery === "object"
            ? { name: x.joinery.name ?? null, virtue: x.joinery.virtue ?? null, code: x.joinery.code ?? "" }
            : null,
        };
      }
      function normBuild(b) {
        return {
          name: b.name, favorite: b.favorite === true,
          soul: normSlot(b.soul), ranged: normSlot(b.ranged), melee: normSlot(b.melee),
        };
      }
      const chips = (arr) =>
        arr && arr.length
          ? arr.map((t) => `<span class="chip">${shortName(t)}</span>`).join("")
          : '<span class="muted">—</span>';
      // Runes/totems as name + effect rows (effect looked up by display name).
      const effectRows = (arr, table) => {
        if (!arr || !arr.length) return '<span class="muted">—</span>';
        return arr
          .map((t) => {
            const name = shortName(t);
            const eff = table[name];
            return `<div class="totemrow"><span class="tname">${name}</span>${eff ? `<span class="teff">${eff}</span>` : ""}</div>`;
          })
          .join("");
      };
      const VIRTUE_COLOR = { Courage: "#d98a6a", Spirit: "#6fae8f", Grace: "#6f9edb" };
      const JOINERY_ICON = { Verite: "verite", Quicksilver: "quicksilver", Feybalt: "feybalt", Gildaur: "gildaur" };
      const joineryIconSrc = (j) => "img/joineries/" + (JOINERY_ICON[j && j.name] || "joinery") + ".png";
      const joineryName = (j) => j.name || (j.code || "reforge").replace(/([a-z])([A-Z])/g, "$1 $2");
      const virtueTag = (v) => (v ? ` · <span style="color:${VIRTUE_COLOR[v] || "var(--text)"}">${v}</span>` : "");
      // Full joinery display (detail panel): product icon + name + virtue (text).
      function joineryLabel(j) {
        if (!j) return '<span class="muted">—</span>';
        const icon = `<img class="jicon" src="${joineryIconSrc(j)}" alt="" onerror="this.style.display='none'">`;
        return `${icon}<span class="jname">${joineryName(j)}</span>${virtueTag(j.virtue)}`;
      }
      // Detail block for one slot - rendered when it carries runes/totems/joinery.
      function slotDetail(label, slot) {
        if (!slot || (!slot.runes.length && !slot.totems.length && !slot.joinery)) return "";
        return `<div class="slotgrp">
          <div class="slothead">${slot.type ? shortName(slot.type) : "—"} <span class="kind">· ${label}</span></div>
          <div class="chipline"><span class="h">Joinery</span>${joineryLabel(slot.joinery)}</div>
          <div class="chipline"><span class="h">Runes</span><div class="totemlist">${effectRows(slot.runes, RUNES)}</div></div>
          <div class="chipline"><span class="h">Totems</span><div class="totemlist">${effectRows(slot.totems, TOTEMS)}</div></div>
        </div>`;
      }
      function buildRow(raw, imported, key) {
        const b = normBuild(raw);
        const cell = (s) => (s.type ? shortName(s.type) : "—");
        // Weapon cell: name + the equipped Joinery (product icon + type name)
        // and which Virtue it attunes (text). No pip icon.
        const wcell = (s) => {
          if (!s.type) return "—";
          if (!s.joinery) return shortName(s.type);
          const j = s.joinery;
          const jimg = `<img class="jmini" src="${joineryIconSrc(j)}" alt="" onerror="this.style.display='none'">`;
          return `${shortName(s.type)} ${jimg} <span class="jtype">${joineryName(j)}</span>${virtueTag(j.virtue)}`;
        };
        const payload = encodeURIComponent(JSON.stringify({ name: b.name, soul: b.soul, ranged: b.ranged, melee: b.melee }));
        const rm = imported ? ` <button class="mini" data-remove="${encodeURIComponent(b.name)}">Remove</button>` : "";
        const badge = imported ? '<span class="tag">imported</span>' : "";
        const star = b.favorite ? '<span class="fav">★ </span>' : "";
        const detail =
          slotDetail("Primary Weapon", b.melee) + slotDetail("Sidearm", b.ranged) + slotDetail("Pact", b.soul) ||
          '<span class="muted">No runes or totems socketed.</span>';
        return `<tr>
          <td class="name" data-toggle="det-${key}"><span class="chev">▸</span>${star}${b.name}${badge}</td>
          <td>${cell(b.soul)}</td>
          <td>${wcell(b.melee)}</td>
          <td>${wcell(b.ranged)}</td>
          <td class="act"><button class="mini" data-export="${payload}">Export</button>${rm}</td>
        </tr>
        <tr class="detail" id="det-${key}"><td colspan="5">${detail}</td></tr>`;
      }
      function renderBuilds() {
        const own = (LAST_BUILDS || []).map((b, i) => buildRow(b, false, "o" + i));
        const imp = IMPORTED_BUILDS.map((b, i) => buildRow(b, true, "i" + i));
        const rows = [...own, ...imp];
        $("loadouts").innerHTML = rows.length
          ? `<table class="loadouts">
              <tr><th>Loadout</th><th>Pact</th><th>Primary Weapon</th><th>Sidearm</th><th class="act"></th></tr>
              ${rows.join("")}
            </table>
            <div class="muted" style="font-size:12px;margin-top:10px">Click a loadout to see each weapon's Joinery (Virtue attunement), runes &amp; totems.</div>`
          : '<span class="muted">No loadouts — run the memory helper to import your inventory, then refresh.</span>';
      }
      function saveImported() {
        try { localStorage.setItem("sfhelper.builds", JSON.stringify(IMPORTED_BUILDS)); } catch {}
      }
      $("loadouts").addEventListener("click", (e) => {
        const tg = e.target.closest("[data-toggle]");
        if (tg) {
          const d = document.getElementById(tg.dataset.toggle);
          if (d) d.classList.toggle("open");
          tg.classList.toggle("open");
        }
        const ex = e.target.closest("[data-export]");
        if (ex) {
          navigator.clipboard?.writeText(decodeURIComponent(ex.dataset.export));
          ex.textContent = "Copied!";
          setTimeout(() => (ex.textContent = "Export"), 1200);
        }
        const rm = e.target.closest("[data-remove]");
        if (rm) {
          const name = decodeURIComponent(rm.dataset.remove);
          IMPORTED_BUILDS = IMPORTED_BUILDS.filter((b) => b.name !== name);
          saveImported();
          renderBuilds();
        }
      });
      $("importBtn").addEventListener("click", () => {
        const el = $("importBuild");
        try {
          const b = JSON.parse(el.value);
          if (!b || typeof b.name !== "string") throw new Error("missing a build name");
          IMPORTED_BUILDS.push(normBuild({ ...b, favorite: false }));
          saveImported();
          el.value = "";
          $("importStatus").textContent = `Imported "${b.name}".`;
          renderBuilds();
        } catch (err) {
          $("importStatus").textContent = "Invalid build JSON.";
        }
      });

      // Global rotating events (Conquests, Descents) with live countdowns.
      let WORLD = { events: [] };
      function eventName(e) {
        if (e.kind === "conquest") {
          return (e.id.replace(/^CT_/, "").replace(/([a-z])([A-Z])/g, "$1 $2") || "Conquest") + " Conquest";
        }
        if (e.kind === "descent") return e.id;
        return e.id;
      }
      function renderWorldTimers() {
        const now = Date.now() / 1000;
        const rows = (WORLD.events || [])
          .filter((e) => e.expiry && e.expiry > now)
          .map((e) => {
            const active = !e.activation || e.activation <= now;
            const target = active ? e.expiry : e.activation;
            const verb = active ? "ends in" : "starts in";
            return `<div class="row"><span class="label">${eventName(e)}</span><span class="val">${verb} <b>${fmtDur((target - now) * 1000)}</b></span></div>`;
          });
        $("worldTimers").innerHTML = rows.length
          ? rows.join("")
          : '<span class="muted">No active rotating events.</span>';
      }
      async function loadWorldState() {
        try {
          const res = await fetch("/api/worldstate");
          if (res.ok) WORLD = await res.json();
        } catch {}
        renderWorldTimers();
      }

      function tickReset() {
        $("dailyReset").textContent = fmtDur(msToDailyReset());
        renderWorldTimers(); // world-timer countdowns tick every second too
      }
      setInterval(tickReset, 1000);
      tickReset();
      loadWorldState();
      setInterval(loadWorldState, 5 * 60 * 1000); // refresh the world state periodically
      renderBuilds(); // show imported builds immediately, before a profile loads

      // Internal currency ids -> in-game names: dict first, then a small fallback.
      const CURRENCY_NAMES = { RegularCredits: "Dracs", PremiumCredits: "Arcs", MoteDust: "Harmonies" };
      function currencyName(id) {
        return DICT.currencies[id] || CURRENCY_NAMES[id] || String(id).replace(/([a-z])([A-Z])/g, "$1 $2");
      }

      // Best guess at a readable name from the internal path, when the dict has
      // no entry: take the leaf, strip engine suffixes, avoid the folder token.
      function cleanName(itemType) {
        const parts = String(itemType).split("/").filter(Boolean);
        const leaf = parts[parts.length - 1] || itemType;
        const stripped = leaf.replace(/(RangedMeleeWeapon|MeleeWeapon|RangedWeapon|Weapon|Soul|Gun)$/, "");
        if (stripped) return stripped.replace(/([a-z])([A-Z])/g, "$1 $2");
        return parts[parts.length - 2] || leaf;
      }
      // Prefer an exact dict match on the full path, then on the leaf, then clean.
      function shortName(itemType) {
        if (DICT.items[itemType]) return DICT.items[itemType];
        const p = String(itemType);
        const leaf = p.split("/").filter(Boolean).pop();
        if (leaf && DICT.items[leaf]) return DICT.items[leaf];
        // Runes key by <WeaponClass><Leaf> (e.g. BowStarterRune -> "Alca's Breath").
        // The path's class token varies from the dict's ("Magiks" vs "Caster"),
        // and casing differs, so try aliases against a lowercased index.
        const rune = p.match(/\/Upgrades\/Runes\/Weapon\/([^/]+)\/([^/]+)$/);
        if (rune) {
          // Inventory weapon-class tokens differ from the localization's:
          // Magiks -> Caster/Magick, LongBlade/GreatSword -> Melee. Try aliases.
          const CLASS_ALIAS = {
            magiks: ["caster", "magick", "magiks"],
            longblade: ["melee", "longblade"],
            greatsword: ["greatsword", "melee"],
          };
          const cls = rune[1], name = rune[2];
          const classes = CLASS_ALIAS[cls.toLowerCase()] || [cls];
          for (const c of classes) {
            const hit = DICT_LC[(c + name).toLowerCase()];
            if (hit) return hit;
          }
        }
        if (leaf && DICT_LC[leaf.toLowerCase()]) return DICT_LC[leaf.toLowerCase()];
        return cleanName(itemType);
      }
      // Group an item path into a human bucket for the XP list. Souls carry the
      // pacts, so they head this "Weapon & Pact XP" section.
      function bucket(itemType) {
        const p = String(itemType);
        if (p.includes("/Souls/")) return "Pacts";
        if (p.includes("/Melee/")) return "Melee Weapons";
        if (p.includes("/Guns/") || p.includes("/Ranged/")) return "Ranged Weapons";
        if (p.includes("/Pact") || p.includes("/Abilities/")) return "Pacts";
        return "Other";
      }
      // A muted secondary tag from the path: the soul's family, or the weapon class.
      function subLabel(itemType) {
        const p = String(itemType);
        if (p.includes("/Souls/")) {
          const fam = p.split("/")[3] || "";
          return fam && fam !== "Default" ? fam : "";
        }
        if (p.includes("/OneHand/")) return "One-Hand";
        if (p.includes("/TwoHand/")) return "Two-Hand";
        if (p.includes("/Thrown/")) return "Thrown";
        if (/Bow/.test(p)) return "Bow";
        if (/(Caster|Staff)/.test(p)) return "Caster";
        return "";
      }
      function factionName(tag) {
        if (DICT.factions[tag]) return DICT.factions[tag];
        return String(tag).replace(/Syndicate$/, "").replace(/([a-z])([A-Z])/g, "$1 $2");
      }
      // The affiliation's raw Tag (e.g. "ChampionSyndicate") is how names.json
      // keys factions; progression stores it as key "affiliation:<Tag>".
      function factionTag(f) {
        return String(f.key || "").replace(/^affiliation:/, "") || f.displayName || "";
      }
      function hours(sec) {
        if (typeof sec !== "number") return "—";
        return Math.round(sec / 3600).toLocaleString() + " h";
      }

      function render(data) {
        $("displayName").textContent = data.account.displayName || "—";
        $("level").textContent = fmt(data.level);
        $("playtime").textContent = hours(data.stats?.scalars?.TimePlayedSec);
        $("updated").textContent = "updated " + new Date(data.capturedAt).toLocaleTimeString();

        // Daily standing (resets at 00:00 UTC - see the header timer).
        const d = data.daily || {};
        $("dailyStanding").innerHTML =
          d.affiliation != null
            ? `Daily standing earned: <b>${fmt(d.affiliation)}</b> — resets in <b>${fmtDur(msToDailyReset())}</b>`
            : "";

        // Faction standing - bar fills toward the CURRENT rank's cap.
        const factions = data.progression.filter((p) => p.kind === "affiliation");
        $("factions").innerHTML =
          factions
            .map((f) => {
              const tag = factionTag(f);
              const info = rankInfo(tag, f.xp, f.rank);
              const val = info
                ? `${fmt(info.into)} / ${fmt(info.cap)}${info.atMax ? " (max rank)" : ""} &nbsp;·&nbsp; Rank ${f.rank ?? 0}`
                : `${fmt(f.xp)} &nbsp;·&nbsp; Rank ${f.rank ?? 0}`;
              const pct = info ? Math.round(info.pct * 100) : 0;
              return `
          <div class="row">
            <span class="label">${factionName(tag)}</span>
            <span class="val">${val}</span>
            <span class="bar"><i style="width:${pct}%"></i></span>
          </div>`;
            })
            .join("") || '<span class="muted">No standing data.</span>';

        // Faction Tokens - owned counts of each faction's rep-token item.
        const owned = data.owned || {};
        const tokenCards = Object.entries(DICT.factionTokens).map(([tag, name]) => {
          const count = owned[`/SF/Types/Items/FactionItems/${tag}RepToken`] ?? 0;
          return `<div class="stat"><div class="n">${fmt(count)}</div><div class="l">${name}</div></div>`;
        });
        $("factionTokens").innerHTML = tokenCards.length
          ? tokenCards.join("")
          : '<span class="muted">Import your inventory to show faction token counts.</span>';

        // Currencies (owned amounts come from inventory, not the public profile).
        const cur = data.currencies || {};
        const curEntries = Object.entries(cur).filter(([, v]) => v); // hide zero balances
        $("currencies").innerHTML = curEntries.length
          ? curEntries
              .map(
                ([k, v]) =>
                  `<div class="stat"><div class="n">${fmt(v)}</div><div class="l">${currencyName(k)}</div></div>`,
              )
              .join("")
          : '<span class="muted">Owned currencies (Dracs, Harmonies…) aren\'t in the public profile — import your inventory to show them.</span>';
        $("invStatus").innerHTML = data.inventory
          ? `Inventory loaded: <b>${data.inventory.itemCount}</b> items from ${data.inventory.source.split(/[\\/]/).pop()} · updated ${new Date(data.inventory.updatedAt).toLocaleString()}`
          : "";

        // Loadouts (presets from inventory + any imported builds).
        LAST_BUILDS = data.builds || [];
        renderBuilds();

        // Weapon & Pact XP, grouped
        const groups = {};
        for (const it of data.items) {
          if (typeof it.rank !== "number") continue;
          const b = bucket(it.key);
          (groups[b] ||= []).push(it);
        }
        const order = ["Pacts", "Melee Weapons", "Ranged Weapons", "Other"];
        $("xp").innerHTML =
          order
            .filter((g) => groups[g]?.length)
            .map((g) => {
              const rows = groups[g]
                .sort((a, b) => (b.rank || 0) - (a.rank || 0))
                .map((it) => {
                  // Class chips only on weapons; pacts/souls show just the name.
                  const sub = g === "Pacts" ? "" : subLabel(it.key);
                  const tag = sub ? ` <span class="sub">${sub}</span>` : "";
                  return `<div class="row"><span class="label">${shortName(it.key)}${tag}</span><span class="val">${fmt(it.rank)} XP</span></div>`;
                })
                .join("");
              return `<div class="xpgroup"><h3>${g} <span class="count">${groups[g].length}</span></h3><div class="rows">${rows}</div></div>`;
            })
            .join("") || '<span class="muted">No XP data.</span>';

        // Scalars
        const s = data.stats?.scalars || {};
        const cards = [
          ["Kills (melee)", s.MeleeKills],
          ["Deaths", s.Deaths],
          ["Revives", s.ReviveCount],
          ["Heals", s.HealCount],
          ["Pickups", s.PickupCount],
          ["Income", s.Income],
        ].filter(([, v]) => typeof v === "number");
        $("scalars").innerHTML = cards
          .map(([l, v]) => `<div class="stat"><div class="n">${fmt(v)}</div><div class="l">${l}</div></div>`)
          .join("");

        // Top weapons / enemies
        const topWeapons = (data.stats?.weapons || [])
          .filter((w) => w.kills)
          .sort((a, b) => (b.kills || 0) - (a.kills || 0))
          .slice(0, 8);
        const topEnemies = (data.stats?.enemies || [])
          .sort((a, b) => (b.kills || 0) - (a.kills || 0))
          .slice(0, 8);
        const wTable = `<div><h3 style="color:var(--accent-2);font-size:13px;margin:0 0 8px">Top Weapons by Kills</h3>
          <table><tr><th>Weapon</th><th class="num">Kills</th><th class="num">XP</th></tr>
          ${topWeapons.map((w) => `<tr><td>${shortName(w.type)}</td><td class="num">${fmt(w.kills)}</td><td class="num">${fmt(w.xp)}</td></tr>`).join("")}</table></div>`;
        const eTable = `<div><h3 style="color:var(--accent-2);font-size:13px;margin:0 0 8px">Top Enemies by Kills</h3>
          <table><tr><th>Enemy</th><th class="num">Kills</th><th class="num">Exec.</th></tr>
          ${topEnemies.map((e) => `<tr><td>${shortName(e.type)}</td><td class="num">${fmt(e.kills)}</td><td class="num">${fmt(e.executions)}</td></tr>`).join("")}</table></div>`;
        $("tables").innerHTML = wTable + eTable;
      }

      let timer = null;
      async function refresh() {
        const id = ($("accountId").value || "").trim();
        if (!/^[0-9a-f]{24}$/i.test(id)) {
          setStatus("Enter your 24-character account id.", true);
          return;
        }
        setStatus("Fetching…");
        try {
          const res = await fetch("/api/profile?accountId=" + encodeURIComponent(id));
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Request failed");
          render(data);
          setStatus("Live · refreshes every 60s");
        } catch (e) {
          setStatus(e.message, true);
        }
      }
      function setStatus(msg, err) {
        const el = $("status");
        el.textContent = msg;
        el.className = "status" + (err ? " err" : "");
      }
      function start() {
        const id = ($("accountId").value || "").trim();
        try { localStorage.setItem("sfhelper.accountId", id); } catch {}
        // Remember it server-side so future launches resolve it automatically.
        if (/^[0-9a-f]{24}$/i.test(id)) {
          fetch("/api/account", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ accountId: id }),
          }).catch(() => {});
        }
        if (timer) clearInterval(timer);
        refresh();
        timer = setInterval(refresh, 60000);
      }

      $("save").addEventListener("click", start);
      $("accountId").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

      // Load the in-game name dictionary before first render, so names resolve.
      async function loadDict() {
        try {
          const res = await fetch("/names.json");
          if (res.ok) {
            DICT = await res.json();
            DICT_LC = {};
            for (const k in DICT.items) DICT_LC[k.toLowerCase()] = DICT.items[k];
          }
        } catch {}
        try {
          const res = await fetch("/faction-ranks.json");
          if (res.ok) FACTION_RANKS = await res.json();
        } catch {}
        try {
          const res = await fetch("/totems.json");
          if (res.ok) TOTEMS = await res.json();
        } catch {}
        try {
          const res = await fetch("/runes.json");
          if (res.ok) RUNES = await res.json();
        } catch {}
      }

      // On load, try to discover the id automatically before asking for it.
      async function autoStart() {
        await loadDict();
        try {
          const res = await fetch("/api/account");
          const data = await res.json();
          if (data.accountId) {
            $("accountId").value = data.accountId;
            const via = data.source === "little-genius" ? "found via Little Genius" : "remembered";
            setStatus("Account id " + via + " — tracking…");
            start();
            return;
          }
        } catch {}
        // Fall back to a value this browser saved earlier.
        try {
          const saved = localStorage.getItem("sfhelper.accountId");
          if (saved) { $("accountId").value = saved; start(); }
        } catch {}
      }
      autoStart();
    </script>
  </body>
</html>
